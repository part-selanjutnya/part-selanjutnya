<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- OPEN GRAPH META TAGS -->
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #141414;
            color: #ffffff;
            padding-bottom: 40px;
        }

        /* HEADER NAVBAR */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: #000000;
            border-bottom: 1px solid #222222;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            color: #e50914;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .badge-live {
            background-color: #e50914;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        /* MAIN VIDEO PLAYER */
        .player-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background-color: #000000;
            aspect-ratio: 16 / 9;
            display: block;
            text-decoration: none;
            overflow: hidden;
        }
        .player-thumbnail {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
        }
        .play-btn {
            width: 65px;
            height: 65px;
            background-color: rgba(229, 9, 20, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.6);
        }
        .play-btn::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 12px 0 12px 22px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 4px;
        }
        .player-title {
            position: absolute;
            bottom: 12px;
            left: 16px;
            right: 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* CONTAINER LIST FILM */
        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin: 16px 0 12px;
            color: #dddddd;
        }

        /* GRID KATALOG FILM */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        @media (min-width: 500px) {
            .movie-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        .movie-card {
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            text-decoration: none;
            color: #ffffff;
            display: block;
            border: 1px solid #2a2a2a;
        }
        .movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
        }
        .movie-info {
            padding: 10px;
        }
        .movie-name {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-tag {
            font-size: 11px;
            color: #aaaaaa;
            margin-top: 4px;
        }
    </style>
</head>
