<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Part Selanjutnya...</title>
    <meta name="referrer" content="no-referrer-when-downgrade">

    <!-- Meta Open Graph untuk Facebook Scraper -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="Lanjutan Alur Cerita Film - Part 2">
    <meta property="og:description" content="Klik untuk menonton kelanjutan video part selanjutnya...">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #1f1f1f;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .play-icon {
            font-size: 42px;
            margin-bottom: 12px;
            color: #ee4d2d;
        }
        h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        p { font-size: 13px; color: #aaa; margin-bottom: 20px; line-height: 1.4; }
        
        /* Kotak Petunjuk Facebook Confirmation */
        .notice-box {
            background-color: rgba(238, 77, 45, 0.1);
            border: 1px dashed #ee4d2d;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #ff8c75;
            text-align: left;
            line-height: 1.4;
        }
        .notice-box strong {
            color: #ffffff;
        }

        .btn-play {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #ee4d2d;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 10px;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(238, 77, 45, 0.4);
            cursor: pointer;
        }
        .btn-play:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <div class="play-icon">▶</div>
        <h2>Part Selanjutnya Siap Diputar</h2>
        <p>Klik tombol di bawah untuk melanjutkan tontonan di aplikasi sponsor.</p>
        
        <!-- PANDUAN UNTUK PENGUNJUNG FACEBOOK -->
        <div class="notice-box">
            💡 <strong>Petunjuk:</strong> Jika muncul konfirmasi <em>"Keluar dari aplikasi"</em> setelah menekan tombol, silakan klik <strong>LANJUTKAN</strong>.
        </div>

        <!-- Tombol Deep Link / App Opener -->
        <a id="appOpenerBtn" href="#" class="btn-play">
           KLIK UNTUK NONTON PART 2
        </a>
    </div>

    <script>
        (function() {
            var rawUrl = "s.shopee.co.id/an_redir?origin_link=https%3A%2F%2Fshopee.co.id%2Fproduct%2F158917373%2F50412934683&affiliate_id=11315710905";

            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isAndroid = /Android/i.test(ua);
            
            var finalDeepLink = "";

            if (isAndroid) {
                // Intent khusus Android untuk memanggil aplikasi Shopee
                finalDeepLink = "intent://" + rawUrl + "#Intent;scheme=https;package=com.shopee.id;end;";
            } else {
                // Universal Link iOS
                finalDeepLink = "https://" + rawUrl;
            }

            var btn = document.getElementById("appOpenerBtn");
            if (btn) {
                btn.href = finalDeepLink;
            }
        })();
    </script>

</body>
</html>
