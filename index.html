<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuka Shopee...</title>
    
    <!-- Meta tag redirect fallback jika JS dinonaktifkan -->
    <meta http-equiv="refresh" content="1;url=https://s.shopee.co.id/7VFmcEzxkv">

    <script>
        (function() {
            var targetUrl = "https://s.shopee.co.id/7VFmcEzxkv";
            
            // Redirect otomatis
            window.location.href = targetUrl;
            
            // Cadangan redirect
            setTimeout(function() {
                window.location.replace(targetUrl);
            }, 300);
        })();
    </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f8f9fa;">
    <p>Sedang mengalihkan ke Shopee...</p>
    <p>Jika tidak terbuka otomatis, <a href="https://s.shopee.co.id/7VFmcEzxkv" style="color: #ee4d2d; font-weight: bold; text-decoration: none;">klik di sini</a>.</p>
</body>
</html>
