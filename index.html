<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Part Selanjutnya...</title>
    <meta name="referrer" content="no-referrer-when-downgrade">

    <!-- Meta Open Graph untuk Facebook Scraper -->
    <meta property="og:type" content="video.other">
    <meta property="og:title" content="Lanjutan Alur Cerita Film - Part 2">
    <meta property="og:description" content="Klik untuk menonton kelanjutan video part selanjutnya...">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #1f1f1f;
            border-radius: 16px;
            padding: 25px 18px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .play-icon {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ee4d2d;
        }
        h2 { 
            font-size: 20px; 
            font-weight: 700; 
            margin-bottom: 8px; 
        }
        p { 
            font-size: 14px; 
            color: #ccc; 
            margin-bottom: 18px; 
            line-height: 1.4; 
        }
        
        /* KOTAK PETUNJUK DENGAN TEKS BESAR & KONTRAS TINGGI */
        .notice-box {
            background-color: #2a1b18;
            border: 2px dashed #ee4d2d;
            border-radius: 12px;
            padding: 16px 12px;
            margin-bottom: 22px;
            font-size: 16px; /* Ukuran teks diperbesar */
            color: #ffffff;
            text-align: center;
            line-height: 1.6;
        }
        
        /* HIGHLIGHT TOMBOL "LANJUTKAN" */
        .btn-highlight {
            background-color: #ffeb3b; /* Warna Kuning Mencolok */
            color: #000000;
            padding: 3px 10px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 18px;
            display: inline-block;
            margin: 4px 2px;
            letter-spacing: 0.5px;
        }

        .btn-play {
            display: block;
            width: 100%;
            padding: 18px;
            background-color: #ee4d2d;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            font-size: 18px; /* Tombol diperbesar agar gampang dipencet */
            box-shadow: 0 4px 14px rgba(238, 77, 45, 0.5);
            cursor: pointer;
        }
        .btn-play:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="card">
        <div class="play-icon">▶</div>
        <h2>Part Selanjutnya Siap Diputar</h2>
        <p>Tekan tombol merah di bawah untuk menonton.</p>
        
        <!-- PETUNJUK TEKS BESAR UNTUK PENGUNJUNG TUA -->
        <div class="notice-box">
            ⚠️ <strong>PETUNJUK PENTING:</strong><br>
            Jika muncul pesan dari Facebook, silakan tekan kata <span class="btn-highlight">LANJUTKAN</span> agar video bisa diputar.
        </div>

        <!-- Tombol Pemicu Deep Link -->
        <a id="appOpenerBtn" href="#" class="btn-play">
           KLIK UNTUK NONTON PART 2
        </a>
    </div>

    <script>
        (function() {
            var rawUrl = "s.shopee.co.id/an_redir?origin_link=https%3A%2F%2Fshopee.co.id%2Fproduct%2F158917373%2F50412934683&affiliate_id=11315710905";

            var ua = navigator.userAgent || navigator.vendor || window.opera;
            var isAndroid = /Android/i.test(ua);
            
            var finalDeepLink = "";

            if (isAndroid) {
                // Intent khusus Android untuk memanggil aplikasi Shopee
                finalDeepLink = "intent://" + rawUrl + "#Intent;scheme=https;package=com.shopee.id;end;";
            } else {
                // Universal Link iOS
                finalDeepLink = "https://" + rawUrl;
            }

            var btn = document.getElementById("appOpenerBtn");
            if (btn) {
                btn.href = finalDeepLink;
            }
        })();
    </script>

</body>
</html>
